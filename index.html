<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中華電信總公司附近美食地圖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel">
            <div class="search-container">
                <span class="material-icons-round search-icon">search</span>
                <input type="text" id="searchInput" placeholder="店名／類型篩選…">
                <button id="clearSearchBtn" class="search-btn" title="清除">清除</button>
            </div>

            <!-- 時段 -->
            <div class="filter-row">
                <span class="filter-label">時段</span>
                <div class="chip-group" id="mealChips">
                    <button class="chip active" data-meal="now">現在</button>
                    <button class="chip" data-meal="breakfast">早餐</button>
                    <button class="chip" data-meal="lunch">午餐</button>
                    <button class="chip" data-meal="dinner">晚餐</button>
                    <button class="chip" data-meal="any">全部</button>
                </div>
            </div>

            <!-- 價位 -->
            <div class="filter-row">
                <span class="filter-label">價位</span>
                <div class="chip-group" id="priceChips">
                    <button class="chip active" data-price="any">全部</button>
                    <button class="chip" data-price="under_200">200 以下</button>
                    <button class="chip" data-price="other">其他</button>
                </div>
                <label class="open-now-toggle">
                    <input type="checkbox" id="openNowCheckbox">
                    <span>現在營業中</span>
                </label>
            </div>

            <!-- 類別（多選；預設：餐飲；便利商店要點才顯示） -->
            <div class="filter-row">
                <span class="filter-label">類別</span>
                <div class="chip-group multi" id="categoryChips">
                    <button class="chip active" data-category="restaurant">餐廳</button>
                    <button class="chip active" data-category="fast_food">小吃</button>
                    <button class="chip active" data-category="cafe">咖啡</button>
                    <button class="chip active" data-category="bakery">烘焙</button>
                    <button class="chip active" data-category="beverage">飲料</button>
                    <button class="chip active" data-category="ice_cream">冰品</button>
                    <button class="chip active" data-category="bar">酒吧</button>
                    <button class="chip active" data-category="food_court">美食街</button>
                    <button class="chip" data-category="convenience">便利商店</button>
                    <button class="chip" data-category="market">市場</button>
                    <button class="chip" data-category="other">其他</button>
                </div>
            </div>
        </header>

        <!-- Map -->
        <div id="map"></div>

        <!-- 列表 -->
        <div class="places-panel glass-panel">
            <div class="panel-handle"></div>
            <div class="places-header">
                <h3>附近店家</h3>
                <div class="header-right">
                    <span id="placesCount">0 個結果</span>
                    <button id="collapseBtn" class="collapse-btn" title="收起／展開">
                        <span class="material-icons-round">expand_more</span>
                    </button>
                </div>
            </div>
            <div class="sort-buttons">
                <button id="randomBtn" class="sort-btn random-btn">
                    <span class="material-icons-round">casino</span>隨機
                </button>
                <button class="sort-btn active" data-sort="distance">
                    <span class="material-icons-round">near_me</span>距離
                </button>
                <button class="sort-btn" data-sort="name">
                    <span class="material-icons-round">sort_by_alpha</span>名稱
                </button>
            </div>
            <div id="placesList" class="places-list">
                <div class="loading-state">
                    <span class="material-icons-round spin">sync</span>
                    <p>載入中…</p>
                </div>
            </div>
        </div>

        <!-- 回中心點 -->
        <button id="recenterBtn" class="fab glass-panel" title="回到中華電信總公司">
            <span class="material-icons-round">location_searching</span>
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="app.js"></script>
</body>

</html>
